name: Feature request
description: Propose a reusable addition or change
title: "[Proposal]: "
labels:
  - proposal
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What general market-infrastructure problem should the project solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful public behavior or API.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What existing tools or approaches have you considered?
  - type: textarea
    id: boundaries
    attributes:
      label: Scope boundaries
      description: State what this proposal should not include.
    validations:
      required: true
